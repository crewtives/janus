name: Bug report
description: Something doesn't work the way the README or docs say it should.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more concrete the repro, the faster this gets fixed.
        Before filing, please check the [open issues](https://github.com/crewtives/janus/issues) for duplicates.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what did Janus do that surprised you?
      placeholder: |
        I ran `bun janus pulse --backfill 7d` and the pulse for project X was empty even though git log shows commits.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: Exact commands, exact output. Redact anything sensitive.
      render: shell
    validations:
      required: true

  - type: input
    id: janus-version
    attributes:
      label: Janus commit
      description: Output of `git rev-parse HEAD` from your janus checkout.
      placeholder: "5361679"
    validations:
      required: true

  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: Output of `bun --version`.
      placeholder: "1.3.14"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - WSL
        - Other
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: LLM provider in use
      options:
        - claude-code (Claude Max)
        - gemini-cli
        - dry-run (no LLM)
        - not relevant
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `bun janus doctor`
      description: Helps narrow down config / auth / path issues quickly.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Logs from `.janus/`, screenshots of vault state, etc.
